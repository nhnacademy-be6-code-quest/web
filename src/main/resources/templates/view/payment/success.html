<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="successFragment ('success')">
<head>
  <title>결제 상태</title>
  <meta charset="UTF-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<style>
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  .order-success-container{
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .order-success{
    width: 650px;
    background-color: #f1f1f1;
    margin: 100px;
    padding: 50px;
    border-radius: 10px;
  }
  .complete-icon-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 1rem;
  }
  .complete-icon {
    color: #22c55e; /* Green color */
    height: 3rem;
    width: 3rem;
  }
  table, th, td {
    border: 1px solid black;
    border-collapse: collapse;
  }
  table{
    width: 100%
  }
  th {
    width: 30%;
  }
  td {
    padding-left: 10px;
    width: 70%;
  }
  tr{
    height: 50px;
    padding-top: 50px;
  }
</style>
</head>
<body>
  <div class="order-success-container">
    <div class="order-success">

      <div class="complete-icon-container">
        <svg class="complete-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>

      <h1>주문이 완료되었습니다</h1>

      <div style="margin-top: 70px;">
        <p>주문 정보</p>
        <table>
          <tr>
            <th>주문번호</th>
            <td><span th:text="${successPaymentOrderInfo.getOrderIdOnDB()}"></span></td>
          </tr>
          <tr>
            <th>상품이름</th>
            <td><span th:text="${successPaymentOrderInfo.getOrderName()}"></span></td>
          </tr>
          <tr>
            <th>결제금액</th>
            <td><span th:text="${successPaymentOrderInfo.getTotalPayAmount()}"></span>원</td>
          </tr>
          <tr>
            <th>배송지</th>
            <td th:text="${successPaymentOrderInfo.getDeliveryAddress()}"></td>
          </tr>
          <tr>
            <th>결제수단</th>
            <td><span th:text="${successPaymentOrderInfo.getPaymentMethodName()}"></span></td>
          </tr>

        </table>
      </div>

      <div style="margin-top: 70px;" th:if="${successPaymentOrderInfo.isVirtualAccount()}">
        <p>가상계좌 입금정보</p>
        <table>
          <tr>
            <th>결제수단</th>
            <td><span th:text="${successPaymentOrderInfo.getVirtualAccountInfo().getBank()}"></span></td>
          </tr>
          <tr>
            <th>계좌번호</th>
            <td><span th:text="${successPaymentOrderInfo.getVirtualAccountInfo().getBank()}"></span></td>
          </tr>
          <tr>
            <th>입금기한</th>
            <td><span th:text="${successPaymentOrderInfo.getVirtualAccountInfo().getBank()}"></span></td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
